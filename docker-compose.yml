services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes: [mongo_data:/data/db]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
  api:
    build: .
    env_file: .env
    depends_on: [mongo, redis]
    ports: ["4000:4000"]
volumes:
  mongo_data:
  redis_data:
